changelog:
  exclude:
    labels:
      - release
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Maintenance
      labels: [chore, refactor]
    - title: Other Changes
      labels: ["*"]
